spring.application.name=mysqlapi

spring.datasource.url=jdbc:mysql://localhost:3306/springbootdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#spring.jpa.properties.hibernate.format_sql=true

management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=SUPER_ADMIN
management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true

info.app.name=My SQL API
info.app.description=Spring Boot REST API for managing employees
info.app.version=1.0.0

logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=INFO

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

server.port=8081

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000
